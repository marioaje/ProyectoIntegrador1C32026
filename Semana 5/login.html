<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Login</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>

  <body>
    <div class="container">
      <header>
        <nav class="nav justify-content-center">
          <a class="nav-link active" href="#" aria-current="page"
            >Active link</a
          >
          <a class="nav-link" href="#">Link</a>
          <a class="nav-link disabled" href="#">Disabled link</a>
        </nav>
      </header>
      <main>
        <div class="container-xxl">
          <form action="http://127.0.0.1:20021/Semana%202/CrearCurso.html">
            <div class="mb-3">
              <label for="" class="form-label">Usuario</label>
              <input
                type="text"
                class="form-control"
                name="usuario"
                id="usuario"
                aria-describedby="helpId"
                placeholder=""
                required
              />
              <small id="helpId" class="form-text text-body-secondary"
                >Help text para usuario</small
              >
            </div>

            <div class="mb-3">
              <label for="" class="form-label">Contrasena</label>
              <input
                type="password"
                class="form-control"
                name="Contrasena"
                id="Contrasena"
                aria-describedby="helpId"
                placeholder=""
                required
              />
              <small id="helpId" class="form-text text-body-secondary"
                >Help text Contrasena</small
              >
            </div>

            <div class="mb-3">
              <label for="" class="form-label">Tipo de usuario</label>
              <select class="form-select form-select-lg" name="" id="">
                <option selected>Select one</option>
                <option value="Admin">Admin</option>
                <option value="Support">Support</option>
                <option value="Guest">Guest</option>
              </select>
            </div>

            <div class="form-check">
              <input class="form-check-input" type="checkbox" value="" id="" />
              <label class="form-check-label" for=""> Recordar </label>
            </div>

            <button type="reset" class="btn btn-danger">Reset</button>

            <button type="submit" class="btn btn-success">
              Enviar formularioos
            </button>

            <a
              name=""
              id=""
              class="btn btn-primary"
              href="recuperar.html"
              role="button"
              >Recuperar</a
            >

            <a
              name=""
              id=""
              class="btn btn-warning"
              href="OlvidoContrasena.html"
              role="button"
              >Olvido Contrasena</a
            >
          </form>
        </div>
      </main>
      <footer>
        <!-- place footer here -->
      </footer>
    </div>

    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
      integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js"
      integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y"
      crossorigin="anonymous"
    ></script>
  </body>
</html>
