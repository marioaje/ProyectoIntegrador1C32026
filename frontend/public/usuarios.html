<!doctype html>
<html lang="es" data-bs-theme="light">
  <head>
    <title>Usuarios - Proyecto Integrador</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="css/estilos.css" />
  </head>

  <body>
    <header>
      <div id="menu"></div>
    </header>

    <main class="container pb-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Dashboard Usuarios</h2>
        <button type="button" id="btnRecargar" class="btn btn-outline-secondary">
          Actualizar
        </button>
      </div>

      <div id="alertaContainer"></div>

      <div class="row g-4">
        <div class="col-12 col-lg-4">
          <div class="card">
            <div class="card-body">
              <h5 id="formTitulo" class="card-title mb-3">Registrar Usuario</h5>

              <form id="usuarioForm">
                <input type="hidden" id="usuarioId" name="usuarioId" value="" />

                <div class="mb-3">
                  <label for="nombre" class="form-label">Nombre</label>
                  <input
                    type="text"
                    class="form-control"
                    id="nombre"
                    name="nombre"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="correo" class="form-label">Correo</label>
                  <input
                    type="email"
                    class="form-control"
                    id="correo"
                    name="correo"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label for="clave" class="form-label">Clave</label>
                  <input
                    type="password"
                    class="form-control"
                    id="clave"
                    name="clave"
                    required
                  />
                </div>

                <div class="d-grid gap-2">
                  <button type="submit" id="btnGuardar" class="btn btn-primary">
                    Guardar
                  </button>
                  <button type="button" id="btnCancelarEdicion" class="btn btn-secondary d-none">
                    Cancelar
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>

        <div class="col-12 col-lg-8">
          <div class="card">
            <div class="card-body p-0">
              <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                  <thead class="table-light">
                    <tr>
                      <th>Nombre</th>
                      <th>Correo</th>
                      <th>Clave</th>
                      <th class="text-end">Acciones</th>
                    </tr>
                  </thead>
                  <tbody id="tablaUsuariosBody">
                    <tr>
                      <td colspan="4" class="text-center py-4">Cargando...</td>
                    </tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <script src="js/menu.js" defer></script>
    <script type="module" src="js/usuarios.js"></script>
  </body>
</html>
