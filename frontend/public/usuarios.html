<!doctype html>
<html lang="en" data-bs-theme="light">
  <head>
    <title>Title</title>
    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
  </head>

  <body>
    <div class="container">
      <header>
        <div id="menu">aca va el menu</div>
        <h2>Dashboard usuarios</h2>

        <div id="mensajeSpinner"></div>
      </header>
      <main>
        <div class="container">
          <!-- Button trigger modal -->
          <button
            type="button"
            class="btn btn-primary btn-lg"
            data-bs-toggle="modal"
            data-bs-target="#modalId"
          >
            Crear usuario
          </button>

          <div class="table-responsive">
            <table class="table table-primary">
              <thead>
                <tr>
                  <th scope="col">ID</th>
                  <th scope="col">Nombre</th>
                  <th scope="col">Correo</th>
                  <th scope="col">Clave</th>
                  <th scope="col">Acciones</th>
                </tr>
              </thead>
              <tbody id="tbodyUsuarios"></tbody>
            </table>
          </div>
        </div>
      </main>

      <!-- Modal -->
      <div
        class="modal fade"
        id="modalId"
        tabindex="-1"
        role="dialog"
        aria-labelledby="modalTitleId"
        aria-hidden="true"
      >
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitleId">Modal Usuario Crear</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <form id="formUsuarioCrear">
                  <div class="mb-3">
                    <label for="" class="form-label">Nombre</label>
                    <input
                      type="text"
                      class="form-control"
                      name="nombre"
                      id="nombre"
                      aria-describedby="helpId"
                      placeholder=""
                      required
                    />
                    <small id="helpId" class="form-text text-body-secondary"
                      >Help text</small
                    >
                  </div>

                  <div class="mb-3">
                    <label for="" class="form-label">Correo</label>
                    <input
                      type="email"
                      class="form-control"
                      name="correo"
                      id="correo"
                      aria-describedby="helpId"
                      placeholder=""
                      required
                    />
                    <small id="helpId" class="form-text text-body-secondary"
                      >Help text Coreo</small
                    >
                  </div>

                  <div class="mb-3">
                    <label for="" class="form-label">Clave</label>
                    <input
                      type="text"
                      class="form-control"
                      name="clave"
                      id="clave"
                      aria-describedby="helpId"
                      placeholder=""
                      required
                    />
                    <small id="helpId" class="form-text text-body-secondary"
                      >Help text Clave</small
                    >
                  </div>

                  <div>
                    <button type="reset" class="btn btn-danger">Limpiar</button>
                    <button type="submit" class="btn btn-primary">
                      Guardar
                    </button>
                  </div>
                </form>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="modalEditar"
        tabindex="-1"
        role="dialog"
        aria-labelledby="modalTitleId"
        aria-hidden="true"
      >
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitleId">
                Modal Usuario Editar
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <form id="formUsuarioEditar">
                  <div class="mb-3">
                    <label for="" class="form-label">Id</label>
                    <input
                      type="text"
                      class="form-control"
                      name="idEditar"
                      id="idEditar"
                      aria-describedby="helpId"
                      placeholder=""
                    />
                    <small id="helpId" class="form-text text-body-secondary"
                      >Help text</small
                    >
                  </div>

                  <div class="mb-3">
                    <label for="" class="form-label">Nombre</label>
                    <input
                      type="text"
                      class="form-control"
                      name="nombreEditar"
                      id="nombreEditar"
                      aria-describedby="helpId"
                      placeholder=""
                      required
                    />
                    <small id="helpId" class="form-text text-body-secondary"
                      >Help text</small
                    >
                  </div>

                  <div class="mb-3">
                    <label for="" class="form-label">Correo</label>
                    <input
                      type="email"
                      class="form-control"
                      name="correoEditar"
                      id="correoEditar"
                      aria-describedby="helpId"
                      placeholder=""
                      required
                    />
                    <small id="helpId" class="form-text text-body-secondary"
                      >Help text Coreo</small
                    >
                  </div>

                  <div class="mb-3">
                    <label for="" class="form-label">Clave</label>
                    <input
                      type="text"
                      class="form-control"
                      name="claveEditar"
                      id="claveEditar"
                      aria-describedby="helpId"
                      placeholder=""
                      required
                    />
                    <small id="helpId" class="form-text text-body-secondary"
                      >Help text Clave</small
                    >
                  </div>

                  <div>
                    <button type="submit" class="btn btn-success">
                      Guardar
                    </button>
                  </div>
                </form>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="modalEliminar"
        tabindex="-1"
        role="dialog"
        aria-labelledby="modalTitleId"
        aria-hidden="true"
      >
        <div class="modal-dialog" role="document">
          <div class="modal-content">
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitleId">
                Modal Usuario Eliminar
              </h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div class="container-fluid">
                <form id="formUsuarioEliminar">
                  <div class="mb-3">
                    <label for="" class="form-label">Id</label>
                    <input
                      type="text"
                      class="form-control"
                      name="idEliminar"
                      id="idEliminar"
                      aria-describedby="helpId"
                      placeholder=""
                    />
                    <small id="helpId" class="form-text text-body-secondary"
                      >Help text</small
                    >
                  </div>

                  <div>
                    <button type="submit" class="btn btn-danger">
                      Eliminar
                    </button>
                  </div>
                </form>
              </div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Close
              </button>
            </div>
          </div>
        </div>
      </div>

      <div class="container" id="footerMenu"></div>
    </div>

    <!-- Bootstrap JavaScript Bundle (includes Popper) -->
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>

    <!-- agregamos un archivo que tenga el menu -->
    <script src="js/menu.js" defer></script>

    <script type="module" src="js/misc.js"></script>
    <script type="module" src="js/usuarioController.js"></script>
  </body>
</html>
