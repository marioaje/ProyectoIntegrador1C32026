<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mi Perfil - Mascotas Rescue</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="site-navbar">
      <div class="nav-container">
        <a href="catalogo.html" class="nav-brand">Mascotas<span>Rescue</span></a>
        <nav class="nav-links">
          <a href="catalogo.html">Catálogo</a>
          <a href="favoritos.html">Favoritos</a>
          <a href="solicitud-adopcion.html">Adoptar</a>
          <a href="perfil-adoptante.html" class="active">Mi Perfil</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline btn-sm">Cerrar Sesión</a>
        </div>
      </div>
    </header>

    <main class="auth-wrapper">
      <section class="card auth-card">
        <div class="card-header">
          <span class="badge badge-emerald">Cuenta de Adoptante</span>
          <h1>Edición de Perfil</h1>
          <p>Mantén tus datos de contacto actualizados para el seguimiento de tus solicitudes.</p>
        </div>

        <form id="form-perfil-adoptante" class="form-stack" action="/usuarios" method="POST">
          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              autocomplete="name"
              value="Valeria Morales"
              required
            />
          </div>

          <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              name="correo"
              autocomplete="email"
              spellcheck="false"
              value="valeria@correo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              autocomplete="tel"
              value="8888-8888"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block">Guardar Cambios</button>
        </form>

        <div class="card-footer">
          <p><a href="catalogo.html">Volver al catálogo de mascotas</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
