<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro de Adoptante - Mascotas Rescue</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="site-navbar">
      <div class="nav-container">
        <a href="catalogo.html" class="nav-brand">Mascotas<span>Rescue</span></a>
        <nav class="nav-links">
          <a href="catalogo.html">Catálogo</a>
          <a href="favoritos.html">Favoritos</a>
          <a href="solicitud-adopcion.html">Adoptar</a>
          <a href="perfil-adoptante.html">Mi Perfil</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline btn-sm">Ingresar</a>
          <a href="registro-adoptante.html" class="btn btn-primary btn-sm active">Registrarse</a>
        </div>
      </div>
    </header>

    <main class="auth-wrapper">
      <section class="card auth-card">
        <div class="card-header">
          <span class="badge badge-accent">Únete a la Comunidad</span>
          <h1>Crear cuenta de Adoptante</h1>
          <p>Completa tus datos para postularte en la adopción responsable de una mascota.</p>
        </div>

        <form id="form-registro-adoptante" class="form-stack" action="/usuarios" method="POST">
          <div class="form-group">
            <label for="nombre">Nombre completo</label>
            <input
              type="text"
              id="nombre"
              name="nombre"
              autocomplete="name"
              placeholder="Ej. Valeria Morales"
              required
            />
          </div>

          <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              name="correo"
              autocomplete="username"
              spellcheck="false"
              placeholder="valeria@correo.com"
              required
            />
          </div>

          <div class="form-group">
            <label for="clave">Contraseña</label>
            <input
              type="password"
              id="clave"
              name="clave"
              autocomplete="new-password"
              minlength="6"
              placeholder="Mínimo 6 caracteres"
              required
            />
          </div>

          <div class="form-group">
            <label for="telefono">Teléfono</label>
            <input
              type="tel"
              id="telefono"
              name="telefono"
              autocomplete="tel"
              placeholder="8888-8888"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block">Registrarse</button>
        </form>

        <div class="card-footer">
          <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión aquí</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
