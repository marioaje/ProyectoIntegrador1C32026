<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iniciar Sesión - Mascotas Rescue</title>
    <link rel="stylesheet" href="css/estilos.css" />
  </head>
  <body>
    <header class="site-navbar">
      <div class="nav-container">
        <a href="catalogo.html" class="nav-brand">Mascotas<span>Rescue</span></a>
        <nav class="nav-links">
          <a href="catalogo.html">Catálogo</a>
          <a href="favoritos.html">Favoritos</a>
          <a href="solicitud-adopcion.html">Adoptar</a>
          <a href="perfil-adoptante.html">Mi Perfil</a>
        </nav>
        <div class="nav-actions">
          <a href="login.html" class="btn btn-outline btn-sm active">Ingresar</a>
          <a href="registro-adoptante.html" class="btn btn-primary btn-sm">Registrarse</a>
        </div>
      </div>
    </header>

    <main class="auth-wrapper">
      <section class="card auth-card">
        <div class="card-header">
          <span class="badge badge-accent">Acceso Adoptantes</span>
          <h1>Bienvenido de nuevo</h1>
          <p>Ingresa tus credenciales para gestionar tus adopciones y favoritos.</p>
        </div>

        <form id="form-login" class="form-stack" action="/login" method="POST">
          <div class="form-group">
            <label for="correo">Correo electrónico</label>
            <input
              type="email"
              id="correo"
              name="correo"
              autocomplete="username"
              spellcheck="false"
              placeholder="nombre@correo.com"
              required
            />
          </div>

          <div class="form-group">
            <div class="label-split">
              <label for="clave">Contraseña</label>
              <a href="recuperar-clave.html" class="link-subtle">¿Olvidaste tu contraseña?</a>
            </div>
            <input
              type="password"
              id="clave"
              name="clave"
              autocomplete="current-password"
              placeholder="••••••••"
              required
            />
          </div>

          <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
        </form>

        <div class="card-footer">
          <p>¿Aún no tienes una cuenta? <a href="registro-adoptante.html">Crear cuenta de adoptante</a></p>
        </div>
      </section>
    </main>
  </body>
</html>
